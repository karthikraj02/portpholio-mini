
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .page {
    min-height: 100vh;
    background: #030712;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: 'Rajdhani', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,200,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,200,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 20s linear infinite;
  }

  @keyframes gridDrift {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }

  .scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 2px,
      rgba(0,255,200,0.012) 2px, rgba(0,255,200,0.012) 4px
    );
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: rgba(5, 15, 25, 0.92);
    border: 1px solid rgba(0,255,200,0.25);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
    animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    box-shadow: 0 0 60px rgba(0,255,200,0.07), inset 0 0 60px rgba(0,0,0,0.5);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffc8, transparent);
    animation: scanBeam 3s ease-in-out infinite;
  }

  @keyframes scanBeam {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .left-panel {
    flex: 1;
    padding: 3rem 2.5rem;
    position: relative;
    border-right: 1px solid rgba(0,255,200,0.12);
    animation: fadeLeft 1s 0.3s both;
  }

  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .status-bar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 2rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #00ffc8;
    opacity: 0.7;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00ffc8;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ffc8; }
    50% { opacity: 0.3; box-shadow: none; }
  }

  .avatar-ring {
    width: 110px; height: 110px;
    position: relative;
    margin-bottom: 1.5rem;
  }

  .avatar-ring::before {
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #00ffc8;
    border-right-color: #00ffc8;
    animation: spin 3s linear infinite;
  }

  .avatar-ring::after {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-bottom-color: rgba(0,255,200,0.3);
    border-left-color: rgba(0,255,200,0.3);
    animation: spin 5s linear infinite reverse;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .avatar-img {
    width: 110px; height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(0,255,200,0.3);
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a2a1f, #051510);
    font-family: 'Orbitron', monospace;
    font-size: 32px;
    font-weight: 900;
    color: #00ffc8;
    letter-spacing: -2px;
    text-shadow: 0 0 20px rgba(0,255,200,0.6);
  }

  .name {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .name span {
    color: #00ffc8;
    text-shadow: 0 0 12px rgba(0,255,200,0.8);
  }

  .degree {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: rgba(0,255,200,0.7);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2rem;
    border-left: 2px solid #00ffc8;
    padding-left: 10px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, #00ffc8, transparent);
    opacity: 0.2;
    margin-bottom: 1.8rem;
  }

  .links-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(0,255,200,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid rgba(0,255,200,0.18);
    border-radius: 3px;
    background: rgba(0,255,200,0.03);
    color: #b0f0e0;
    text-decoration: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    margin-bottom: 10px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: #00ffc8;
    transform: scaleY(0);
    transition: transform 0.2s;
  }

  .link-btn:hover {
    border-color: rgba(0,255,200,0.5);
    background: rgba(0,255,200,0.07);
    color: #00ffc8;
    transform: translateX(4px);
  }

  .link-btn:hover::before { transform: scaleY(1); }

  .link-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    opacity: 0.8;
  }

  .link-arrow {
    margin-left: auto;
    opacity: 0.4;
    font-size: 14px;
  }

  .right-panel {
    width: 420px;
    flex-shrink: 0;
    height: 100%;
    min-height: 520px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: radial-gradient(ellipse at 60% 80%, rgba(0,255,200,0.04) 0%, transparent 70%);
    overflow: hidden;
    padding-bottom: 0;
  }

  .desk-scene {
    position: relative;
    width: 380px;
    animation: floatIn 1s 0.5s both;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .desk-scene svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .corner-deco {
    position: absolute;
    width: 20px; height: 20px;
    border-color: #00ffc8;
    border-style: solid;
    opacity: 0.5;
  }
  .corner-deco.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
  .corner-deco.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
  .corner-deco.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
  .corner-deco.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

  .typing-cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: #00ffc8;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .tag-line {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0,255,200,0.5);
    margin-bottom: 1.5rem;
  }

</style>
