<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karthik Raj | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    background: #030712;
    min-height: 100%;
  }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    background: #030712;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: 'Rajdhani', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 200, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 200, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 20s linear infinite;
  }

  @keyframes gridDrift {
    from {
      background-position: 0 0;
    }

    to {
      background-position: 40px 40px;
    }
  }

  .scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg,
        transparent, transparent 2px,
        rgba(0, 255, 200, 0.012) 2px, rgba(0, 255, 200, 0.012) 4px);
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: rgba(5, 15, 25, 0.92);
    border: 1px solid rgba(0, 255, 200, 0.25);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow: hidden;
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    box-shadow: 0 0 60px rgba(0, 255, 200, 0.07), inset 0 0 60px rgba(0, 0, 0, 0.5);
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(30px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffc8, transparent);
    animation: scanBeam 3s ease-in-out infinite;
  }

  @keyframes scanBeam {

    0%,
    100% {
      opacity: 0.3;
    }

    50% {
      opacity: 1;
    }
  }

  .left-panel {
    flex: 1;
    padding: 3rem 2.5rem;
    position: relative;
    border-right: 1px solid rgba(0, 255, 200, 0.12);
    animation: fadeLeft 1s 0.3s both;
  }

  @keyframes fadeLeft {
    from {
      opacity: 0;
      transform: translateX(-20px);
    }

    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #00ffc8;
    opacity: 0.7;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ffc8;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 1;
      box-shadow: 0 0 6px #00ffc8;
    }

    50% {
      opacity: 0.3;
      box-shadow: none;
    }
  }

  .avatar-ring {
    width: 110px;
    height: 110px;
    position: relative;
    margin-bottom: 1.5rem;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #00ffc8;
    border-right-color: #00ffc8;
    animation: spin 3s linear infinite;
  }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-bottom-color: rgba(0, 255, 200, 0.3);
    border-left-color: rgba(0, 255, 200, 0.3);
    animation: spin 5s linear infinite reverse;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .avatar-img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(0, 255, 200, 0.3);
    display: block;
    background: linear-gradient(135deg, #0a2a1f, #051510);
  }

  .name {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }

  .name span {
    color: #00ffc8;
    text-shadow: 0 0 12px rgba(0, 255, 200, 0.8);
  }

  .degree {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: rgba(0, 255, 200, 0.7);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2rem;
    border-left: 2px solid #00ffc8;
    padding-left: 10px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, #00ffc8, transparent);
    opacity: 0.2;
    margin-bottom: 1.8rem;
  }

  .links-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(0, 255, 200, 0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid rgba(0, 255, 200, 0.18);
    border-radius: 3px;
    background: rgba(0, 255, 200, 0.03);
    color: #b0f0e0;
    text-decoration: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    margin-bottom: 10px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #00ffc8;
    transform: scaleY(0);
    transition: transform 0.2s;
  }

  .link-btn:hover {
    border-color: rgba(0, 255, 200, 0.5);
    background: rgba(0, 255, 200, 0.07);
    color: #00ffc8;
    transform: translateX(4px);
  }

  .link-btn:hover::before {
    transform: scaleY(1);
  }

  .link-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .link-arrow {
    margin-left: auto;
    opacity: 0.4;
    font-size: 14px;
  }

  .right-panel {
    width: 420px;
    flex-shrink: 0;
    height: 100%;
    min-height: 520px;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: radial-gradient(ellipse at 60% 80%, rgba(0, 255, 200, 0.04) 0%, transparent 70%);
    overflow: hidden;
    padding-bottom: 0;
  }

  .desk-scene {
    position: relative;
    width: 380px;
    animation: floatIn 1s 0.5s both;
  }

  @keyframes floatIn {
    from {
      opacity: 0;
      transform: translateY(40px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .desk-scene svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .corner-deco {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: #00ffc8;
    border-style: solid;
    opacity: 0.5;
  }

  .corner-deco.tl {
    top: 12px;
    left: 12px;
    border-width: 1px 0 0 1px;
  }

  .corner-deco.tr {
    top: 12px;
    right: 12px;
    border-width: 1px 1px 0 0;
  }

  .corner-deco.bl {
    bottom: 12px;
    left: 12px;
    border-width: 0 0 1px 1px;
  }

  .corner-deco.br {
    bottom: 12px;
    right: 12px;
    border-width: 0 1px 1px 0;
  }

  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #00ffc8;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0;
    }
  }

  .tag-line {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0, 255, 200, 0.5);
    margin-bottom: 1.5rem;
  }

  /* ---------- Typewriter tagline ---------- */
  .tag-line {
    display: flex;
    align-items: center;
  }

  .typed {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    max-width: 100%;
    width: 43ch;
    animation: typing 2.6s steps(43, end) 1s both;
  }

  @keyframes typing {
    from {
      width: 0;
    }

    to {
      width: 43ch;
    }
  }

  /* ---------- Character animations ---------- */
  .desk-scene svg * {
    transform-box: fill-box;
  }

  .type-l,
  .type-r {
    transform-origin: 50% 0%;
    animation: typeHand 0.36s ease-in-out infinite;
  }

  .type-r {
    animation-delay: 0.18s;
  }

  @keyframes typeHand {

    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-2.5px);
    }
  }

  .head {
    transform-origin: 50% 100%;
    animation: headBob 4s ease-in-out infinite;
  }

  @keyframes headBob {

    0%,
    100% {
      transform: translateY(0) rotate(0deg);
    }

    50% {
      transform: translateY(-1px) rotate(-1deg);
    }
  }

  .eyes {
    transform-origin: 50% 50%;
    animation: blinkEyes 5s infinite;
  }

  @keyframes blinkEyes {

    0%,
    92%,
    100% {
      transform: scaleY(1);
    }

    95% {
      transform: scaleY(0.1);
    }
  }

  .key {
    animation: keyFlash 0.9s ease-in-out infinite;
  }

  .key.k1 {
    animation-delay: 0.22s;
  }

  .key.k2 {
    animation-delay: 0.45s;
  }

  .key.k3 {
    animation-delay: 0.67s;
  }

  @keyframes keyFlash {

    0%,
    100% {
      opacity: 0.25;
    }

    50% {
      opacity: 0.9;
    }
  }

  .screen-glow {
    animation: screenPulse 3s ease-in-out infinite;
  }

  @keyframes screenPulse {

    0%,
    100% {
      opacity: 0.04;
    }

    50% {
      opacity: 0.16;
    }
  }

  .float {
    animation: floatText 5s ease-in-out infinite;
  }

  .float.f2 {
    animation-delay: 1s;
  }

  .float.f3 {
    animation-delay: 2s;
  }

  .float.f4 {
    animation-delay: 3s;
  }

  @keyframes floatText {

    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-8px);
    }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .page {
      padding: 1rem;
    }

    .card {
      flex-direction: column;
      align-items: stretch;
    }

    .left-panel {
      padding: 2rem 1.5rem;
      border-right: none;
      border-bottom: 1px solid rgba(0, 255, 200, 0.12);
    }

    .right-panel {
      width: 100%;
      min-height: 0;
      padding-top: 1rem;
    }

    .desk-scene {
      width: min(380px, 100%);
    }
  }

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* =====================================================
     DYNAMIC LAYER
     ===================================================== */
  @property --ang {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  #bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .cursor-glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 460px;
    height: 460px;
    margin: -230px 0 0 -230px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 200, 0.11), transparent 62%);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.4s;
    will-change: transform;
  }

  .cursor-glow.on {
    opacity: 1;
  }

  /* --- tilting card + sweeping neon border --- */
  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    perspective: 1400px;
  }

  .tilt {
    position: relative;
    transition: transform 0.18s ease-out;
    will-change: transform;
  }

  .tilt::before,
  .tilt::after {
    content: '';
    position: absolute;
    border-radius: 6px;
    z-index: -1;
    pointer-events: none;
    background: conic-gradient(from var(--ang),
        transparent 0deg, transparent 240deg,
        rgba(0, 255, 200, 0.95) 315deg,
        rgba(0, 207, 255, 0.95) 342deg,
        transparent 360deg);
    animation: borderSpin 6s linear infinite;
  }

  .tilt::before {
    inset: -2px;
  }

  .tilt::after {
    inset: -6px;
    filter: blur(16px);
    opacity: 0.45;
  }

  @keyframes borderSpin {
    to {
      --ang: 360deg;
    }
  }

  .card {
    animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .spot {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 50%), rgba(0, 255, 200, 0.10), transparent 45%);
    opacity: 0;
    transition: opacity 0.35s;
  }

  .card:hover .spot {
    opacity: 1;
  }

  /* --- status clock --- */
  .status-bar {
    flex-wrap: wrap;
  }

  .clock {
    margin-left: auto;
    letter-spacing: 1px;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }

  /* --- rotating tagline (JS types it) --- */
  .typed {
    width: auto;
    animation: none;
    overflow: hidden;
    text-overflow: clip;
  }

  .tag-line {
    min-height: 1.4em;
  }

  /* --- name glitch --- */
  .name {
    cursor: default;
    user-select: none;
  }

  .name.glitch {
    animation: glitch 0.42s steps(2, end);
  }

  @keyframes glitch {
    0% {
      transform: translate(0);
      text-shadow: 2px 0 #ff2bd6, -2px 0 #00cfff;
    }

    20% {
      transform: translate(-3px, 1px);
      text-shadow: -3px 0 #ff2bd6, 3px 0 #00cfff;
      clip-path: inset(10% 0 55% 0);
    }

    40% {
      transform: translate(3px, -1px);
      text-shadow: 3px 0 #ff2bd6, -3px 0 #00cfff;
      clip-path: inset(50% 0 10% 0);
    }

    60% {
      transform: translate(-1px, 0);
      clip-path: inset(0 0 60% 0);
    }

    80% {
      transform: translate(2px, 1px);
      clip-path: none;
    }

    100% {
      transform: none;
    }
  }

  /* --- avatar: holo scan + hover --- */
  .avatar-scan {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }

  .avatar-scan::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    top: 0;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.9), transparent);
    box-shadow: 0 0 10px rgba(0, 255, 200, 0.8);
    animation: scanY 3.6s ease-in-out infinite;
  }

  @keyframes scanY {

    0%,
    100% {
      transform: translateY(0);
      opacity: 0;
    }

    10%,
    90% {
      opacity: 1;
    }

    50% {
      transform: translateY(108px);
    }
  }

  .avatar-img {
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s;
  }

  .avatar-ring:hover .avatar-img {
    transform: scale(1.06);
    filter: saturate(1.15) contrast(1.05);
  }

  /* --- link buttons: staggered entrance + shimmer --- */
  .link-btn {
    animation: linkIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

  .left-panel a.link-btn:nth-of-type(1) {
    animation-delay: 1.1s;
  }

  .left-panel a.link-btn:nth-of-type(2) {
    animation-delay: 1.2s;
  }

  .left-panel a.link-btn:nth-of-type(3) {
    animation-delay: 1.3s;
  }

  .left-panel a.link-btn:nth-of-type(4) {
    animation-delay: 1.4s;
  }

  @keyframes linkIn {
    from {
      opacity: 0;
      transform: translateX(-24px);
    }

    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .link-btn::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(0, 255, 200, 0.18), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
  }

  .link-btn:hover::after {
    animation: shimmer 0.8s ease-out;
  }

  @keyframes shimmer {
    to {
      left: 130%;
    }
  }

  .link-btn:hover .link-arrow {
    opacity: 1;
    transform: translate(2px, -2px);
  }

  .link-arrow {
    transition: transform 0.2s, opacity 0.2s;
  }

  .link-btn:hover .link-icon {
    filter: drop-shadow(0 0 5px #00ffc8);
    opacity: 1;
  }

  .link-btn:focus-visible {
    outline: 2px solid #00ffc8;
    outline-offset: 2px;
  }

  /* --- character: parallax + gaze + CRT screen --- */
  .desk-scene svg {
    transform: translate(var(--px, 0px), var(--py, 0px));
    transition: transform 0.25s ease-out;
  }

  .sweep {
    animation: sweepDown 3.2s linear infinite;
  }

  @keyframes sweepDown {
    from {
      transform: translateY(0);
    }

    to {
      transform: translateY(109px);
    }
  }

  /* --- click ripple --- */
  .ripple {
    position: fixed;
    width: 160px;
    height: 160px;
    margin: -80px 0 0 -80px;
    border: 1.5px solid #00ffc8;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    animation: ripple 0.75s ease-out forwards;
  }

  @keyframes ripple {
    from {
      transform: scale(0.06);
      opacity: 0.9;
    }

    to {
      transform: scale(1);
      opacity: 0;
    }
  }

  @media (hover: none) {

    .cursor-glow,
    .spot {
      display: none;
    }
  }

  /* --- fit-to-screen: desktop shows everything at once, no scrolling --- */
  .fit {
    width: 100%;
    max-width: 960px;
    transform-origin: center center;
  }

  @media (min-width: 821px) {

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    .page {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding: 0;
    }

    /* JS scales this fixed-size block up or down to fill the display */
    .fit {
      width: 960px;
      max-width: none;
      flex: none;
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="grid-bg"></div>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scanline"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <div class="fit"><div class="stage"><div class="tilt"><div class="card">
    <div class="spot"></div>
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <!-- LEFT: Info Panel -->
    <div class="left-panel">
      <div class="status-bar">
        <div class="status-dot"></div>
        SYSTEM ONLINE &nbsp;·&nbsp; DEV_MODE ACTIVE
        <span class="clock" id="clock"></span>

<script>
  (function () {
    'use strict';
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    var $ = function (s) { return document.querySelector(s); };
    var lerp = function (a, b, t) { return a + (b - a) * t; };
    var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };

    /* ---------- fit the whole card to the desktop display (no scrolling) ---------- */
    var fit = $('.fit'), fitScale = 1;
    var desk = window.matchMedia('(min-width: 821px)');
    function fitToScreen() {
      if (!fit) return;
      if (!desk.matches) { fit.style.transform = ''; fitScale = 1; return; }
      var pad = 24;
      var s = Math.min((window.innerWidth - pad * 2) / fit.offsetWidth, (window.innerHeight - pad * 2) / fit.offsetHeight);
      fitScale = clamp(s, 0.4, 1.6);
      fit.style.transform = 'scale(' + fitScale.toFixed(4) + ')';
    }
    fitToScreen();
    window.addEventListener('resize', fitToScreen);
    window.addEventListener('load', fitToScreen);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
    if (window.ResizeObserver && fit) new ResizeObserver(fitToScreen).observe(fit);

    /* ---------- video: autoplay can be blocked inside SVG foreignObject ---------- */
    var vid = $('.desk-scene video');
    if (vid) {
      vid.muted = true;
      var play = function () { var p = vid.play(); if (p && p.catch) p.catch(function () {}); };
      play();
      document.addEventListener('click', play, { once: true });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
    }

    /* ---------- shared pointer state ---------- */
    var mouse = { x: 0, y: 0, active: false };
    var page = $('.page'), stage = $('.stage'), tilt = $('.tilt'), card = $('.card');
    var glow = $('.cursor-glow'), scene = $('.desk-scene'), gaze = $('#gaze');
    var gx = 0, gy = -0.6, px = 0, py = 0, cgx = 0, cgy = 0;

    document.addEventListener('pointermove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      if (glow && fine) glow.classList.add('on');
      if (!fine || reduce || !stage) return;
      var r = stage.getBoundingClientRect();
      var nx = clamp((e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2), -1, 1);
      var ny = clamp((e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2), -1, 1);
      tilt.style.transform = 'rotateX(' + (-ny * 3.5).toFixed(2) + 'deg) rotateY(' + (nx * 4.5).toFixed(2) + 'deg)';
      card.style.setProperty('--mx', ((e.clientX - r.left) / fitScale) + 'px');
      card.style.setProperty('--my', ((e.clientY - r.top) / fitScale) + 'px');
    }, { passive: true });

    document.documentElement.addEventListener('pointerleave', function () {
      mouse.active = false;
      if (glow) glow.classList.remove('on');
      if (tilt) tilt.style.transform = '';
    });

    /* ---------- particle network canvas ---------- */
    var cv = $('#bg'), ctx = cv.getContext('2d');
    var pts = [], bursts = [], W = 0, H = 0, dpr = 1;
    var LINK = 125, MOUSE_R = 170;

    function seed() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(clamp((W * H) / 15000, 24, 95));
      pts = [];
      for (var i = 0; i < n; i++) {
        pts.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.2 + 0.6, c: Math.random() < 0.25 ? '0,207,255' : '0,255,200'
        });
      }
    }

    function drawFrame(animate) {
      var cr = cv.getBoundingClientRect();
      var mx = mouse.x - cr.left, my = mouse.y - cr.top, ma = mouse.active && fine;
      ctx.clearRect(0, 0, W, H);
      var i, j, a, b, dx, dy, d;
      for (i = 0; i < pts.length; i++) {
        a = pts[i];
        if (animate) {
          a.x += a.vx; a.y += a.vy;
          if (a.x < 0 || a.x > W) a.vx *= -1;
          if (a.y < 0 || a.y > H) a.vy *= -1;
          if (ma) {
            dx = a.x - mx; dy = a.y - my; d = Math.sqrt(dx * dx + dy * dy);
            if (d < MOUSE_R && d > 1) { a.x += (dx / d) * (1 - d / MOUSE_R) * 1.6; a.y += (dy / d) * (1 - d / MOUSE_R) * 1.6; }
          }
        }
        for (j = i + 1; j < pts.length; j++) {
          b = pts[j]; dx = a.x - b.x; dy = a.y - b.y; d = dx * dx + dy * dy;
          if (d < LINK * LINK) {
            ctx.strokeStyle = 'rgba(0,255,200,' + ((1 - Math.sqrt(d) / LINK) * 0.22).toFixed(3) + ')';
            ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        if (ma) {
          dx = a.x - mx; dy = a.y - my; d = Math.sqrt(dx * dx + dy * dy);
          if (d < MOUSE_R) {
            ctx.strokeStyle = 'rgba(0,207,255,' + ((1 - d / MOUSE_R) * 0.55).toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my); ctx.stroke();
          }
        }
        ctx.fillStyle = 'rgba(' + a.c + ',0.75)';
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
      }
      for (i = bursts.length - 1; i >= 0; i--) {
        b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vx *= 0.96; b.vy *= 0.96; b.life -= 0.02;
        if (b.life <= 0) { bursts.splice(i, 1); continue; }
        ctx.fillStyle = 'rgba(0,255,200,' + b.life.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, 6.2832); ctx.fill();
      }
    }

    seed();
    var resizeT;
    window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(function () { seed(); if (reduce) drawFrame(false); }, 120); });

    /* ---------- main loop: canvas + cursor glow + eye gaze + parallax ---------- */
    function loop() {
      drawFrame(true);
      if (glow && fine) {
        cgx = lerp(cgx, mouse.x, 0.14); cgy = lerp(cgy, mouse.y, 0.14);
        glow.style.transform = 'translate(' + cgx.toFixed(1) + 'px,' + cgy.toFixed(1) + 'px)';
      }
      if (scene) {
        var sr = scene.getBoundingClientRect();
        var tx = 0, ty = -0.6, ppx = 0, ppy = 0;
        if (mouse.active) {
          var ex = sr.left + sr.width * (190 / 380), ey = sr.top + sr.height * (262 / 520);
          var dx = mouse.x - ex, dy = mouse.y - ey, d = Math.sqrt(dx * dx + dy * dy) || 1;
          var k = Math.min(1, d / 260);
          tx = (dx / d) * k; ty = (dy / d) * k;
          ppx = (mouse.x / window.innerWidth - 0.5) * -10; ppy = (mouse.y / window.innerHeight - 0.5) * -6;
        }
        gx = lerp(gx, tx, 0.12); gy = lerp(gy, ty, 0.12);
        if (gaze) gaze.style.transform = 'translate(' + (gx * 2.4).toFixed(2) + 'px,' + (gy * 1.8).toFixed(2) + 'px)';
        px = lerp(px, ppx, 0.08); py = lerp(py, ppy, 0.08);
        scene.style.setProperty('--px', px.toFixed(2) + 'px');
        scene.style.setProperty('--py', py.toFixed(2) + 'px');
      }
      requestAnimationFrame(loop);
    }
    if (reduce) { drawFrame(false); } else { requestAnimationFrame(loop); }

    /* ---------- click ripple + particle burst ---------- */
    document.addEventListener('pointerdown', function (e) {
      if (reduce) return;
      var r = document.createElement('div');
      r.className = 'ripple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      setTimeout(function () { r.remove(); }, 800);
      var cr = cv.getBoundingClientRect();
      for (var i = 0; i < 14; i++) {
        var ang = Math.random() * 6.2832, sp = Math.random() * 3 + 1;
        bursts.push({ x: e.clientX - cr.left, y: e.clientY - cr.top, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1 });
      }
    });

    /* ---------- rotating typewriter tagline ---------- */
    var typed = $('#typed');
    var phrases = ['> Building the future, one commit at a time', '> MSc Computer Science', '> Blue Teamer'];
    if (typed) {
      if (reduce) { typed.textContent = phrases[0]; }
      else {
        var pi = 0, ci = 0, del = false;
        typed.textContent = '';
        (function tick() {
          var full = phrases[pi], delay;
          if (!del) {
            ci++; typed.textContent = full.slice(0, ci);
            if (ci === full.length) { del = true; delay = 2000; } else { delay = 45 + Math.random() * 40; }
          } else {
            ci--; typed.textContent = full.slice(0, ci);
            if (ci === 0) { del = false; pi = (pi + 1) % phrases.length; delay = 350; } else { delay = 22; }
          }
          setTimeout(tick, delay);
        })();
      }
    }

    /* ---------- name glitch ---------- */
    var nm = $('.name');
    if (nm && !reduce) {
      var glitch = function () {
        nm.classList.remove('glitch'); void nm.offsetWidth; nm.classList.add('glitch');
        setTimeout(function () { nm.classList.remove('glitch'); }, 450);
      };
      nm.addEventListener('mouseenter', glitch);
      (function sched() { setTimeout(function () { glitch(); sched(); }, 5000 + Math.random() * 4000); })();
      setTimeout(glitch, 1400);
    }

    /* ---------- live clock + uptime ---------- */
    var clock = $('#clock'), t0 = Date.now();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tickClock() {
      var d = new Date(), s = Math.floor((Date.now() - t0) / 1000);
      clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
        ' · UP ' + pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    }
    if (clock) { tickClock(); setInterval(tickClock, 1000); }
  })();
</script>
